    <linearGradient id="parcel" x2=".9" y2="1"><stop stop-color="#eff2ce"/><stop offset="1" stop-color="#c3d79a"/></linearGradient>
    <linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#668d4e"/><stop offset="1" stop-color="#315d42"/></linearGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#background)"/>
