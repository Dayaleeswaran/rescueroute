    <circle cx="464" cy="78.5" r="3" fill="#c8dda1"/>
    <text x="477" y="82.5" fill="#d3e0b7" font-size="10" font-weight="700" letter-spacing="1.7">FOOD RESCUE, COORDINATED</text>
    <text x="444" y="177" fill="#f6f6e9" font-size="77" font-weight="700" letter-spacing="-3.5">Rescue<tspan fill="#cde0a7">Route</tspan></text>
    <text x="449" y="220" fill="#e7ad80" font-size="14" font-weight="700" letter-spacing="3.5">LESS WASTE. MORE CONNECTION.</text>
