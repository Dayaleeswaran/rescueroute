# A public, isolated evaluation demo. No paid disk or external AI key required.
services:
  - type: web
    name: rescueroute-demo
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: PUBLIC_DEMO
        value: "true"
      - key: NODE_ENV
        value: production
